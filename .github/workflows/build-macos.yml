name: build-macos

# 用 GitHub Actions 的 macOS runner 編譯 accelon26（Wails v3 + WKWebView）。
#
# 觸發方式：Actions 頁面手動 Run workflow，或推 `mac-*` 標籤。
#
# 產出：artifact `accelon26-macos-arm64`（Apple Silicon）與 `accelon26-macos-x86_64`
# （Intel），各自是 .app 的 zip ＋ sha256。解開拖進「應用程式」就能用；
# 未經 Apple 公證，第一次要在 Finder 右鍵 →「打開」。
#
# 打包用 wails/scripts/package-macos.sh —— 本機編譯時也是同一支，
# 所以「本機編的」與「CI 編的」是同一個形狀（見 MACOS.md）。
#
# macOS 版的差異（第一版）：
#   * **不會自己換檔**（Windows 換的是一顆 exe，macOS 換的是整個 .app，牽涉簽章／公證）：
#     版本檢查照做（左上角閃動＋About 顯示「發現新版本」），但「下載更新」按鈕開的是官網，
#     使用者自己下載新的 .app 換掉舊的。Go 層 updatesSupported() 回 false 只管「安裝」。
#   * 沒有游標座標 API（不用 cgo）：啟動時放在「視窗所在的那張螢幕」，不是游標那張。
#   * mmap／開外部連結／訊息框走 sys_darwin.go（syscall.Mmap、open、osascript）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-*'

# 發 Release 要寫權限（GITHUB_TOKEN 預設可能只有讀）。
permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon（arm64）。Intel 版用交叉編譯（同一台 runner）。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: wails/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # assets/index.html 是單檔 HTML，由 TypeScript 建置腳本產生（不是 npm）。
      # ts/ 沒有任何 npm 依賴（沒有 bun.lock、也沒有 node_modules），所以不必 install。
      - name: 建置單檔 HTML
        working-directory: ts
        run: bun run tools/build-desktop.ts

      # 先跑一次測試：這裡同時驗證了 mmap（syscall.Mmap）、檔案白名單、搜尋解析
      # 這些在 macOS 上真的會執行的程式碼（Windows runner 驗不到這些）。
      # 失敗時把關鍵幾行印成 annotation —— 公開 repo 不登入也讀得到：
      #   https://api.github.com/repos/<owner>/<repo>/check-runs/<id>/annotations
      - name: 測試（go vet ＋ go test）
        working-directory: wails
        env:
          CGO_ENABLED: '1'
        run: |
          set +e
          go vet ./... > vet.log 2>&1; VET=$?
          go test ./... > test.log 2>&1; TEST=$?
          echo "go vet exit=$VET ; go test exit=$TEST"
          if [ "$TEST" -ne 0 ]; then
            grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' test.log | head -8 |
              while IFS= read -r l; do echo "::error title=go test::$l"; done
            tail -30 test.log
          fi
          if [ "$VET" -ne 0 ]; then
            head -20 vet.log | while IFS= read -r l; do echo "::error title=go vet::$l"; done
            head -20 vet.log
          fi
          [ "$VET" -eq 0 ] && [ "$TEST" -eq 0 ]

      - name: 編譯（arm64）
        working-directory: wails
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p ../build/macos/arm64
          # -tags production：Wails 的發佈模式（關掉 devtools 選單與除錯日誌）。
          go build -trimpath -tags production \
            -ldflags "-X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../build/macos/arm64/accelon26 .

      - name: 編譯（Intel x86_64，交叉編譯）
        # Apple clang 可以在 arm64 runner 上產生 x86_64（-arch x86_64）。
        # 失敗不擋 arm64：這一步只是「順便也多一個 Intel 版」。
        continue-on-error: true
        working-directory: wails
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
          CC: clang -arch x86_64
        run: |
          mkdir -p ../build/macos/x86_64
          go build -trimpath -tags production \
            -ldflags "-X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../build/macos/x86_64/accelon26 .

      - name: 煙霧測試（-version／-selftest 不開 GUI）
        # 在倉庫根目錄跑：那裡有 13j.adb／yinshun.adb／fgdict.adb，-selftest 會真的
        # mmap 這幾個檔並讀 200 次，等於在 macOS 上驗一遍 syscall.Mmap 那條路。
        run: |
          ./build/macos/arm64/accelon26 -version
          ./build/macos/arm64/accelon26 -selftest
          if [ -f build/macos/x86_64/accelon26 ]; then
            file build/macos/x86_64/accelon26    # 確認真的是 Mach-O 64-bit x86_64
          else
            echo "（x86_64 沒有產出，這次只有 arm64）"
          fi

      - name: 包成 .app ＋ zip
        # Info.plist、icns、ad-hoc 簽章、ditto 壓縮都在 scripts/package-macos.sh 裡
        # （本機編譯也用同一支，所以兩邊的 .app 一模一樣）。
        working-directory: wails
        run: |
          bash scripts/package-macos.sh arm64
          if [ -f ../build/macos/x86_64/accelon26 ]; then
            bash scripts/package-macos.sh x86_64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: accelon26-macos-arm64
          path: |
            build/macos/accelon26-macos-arm64.zip
            build/macos/accelon26-macos-arm64.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('build/macos/accelon26-macos-x86_64.zip') != '' }}
        with:
          name: accelon26-macos-x86_64
          path: |
            build/macos/accelon26-macos-x86_64.zip
            build/macos/accelon26-macos-x86_64.zip.sha256
          if-no-files-found: warn

      # tag 觸發時順便發一個 Release：asset 是公開下載的（不需要登入 GitHub），
      # 比 Actions 的 artifact 好用 —— 而且也給使用者一個永久連結。
      - name: 附加到 Release（`mac-*` 標籤觸發時）
        if: startsWith(github.ref, 'refs/tags/mac-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/accelon26-macos-arm64.zip
            build/macos/accelon26-macos-arm64.zip.sha256
            build/macos/accelon26-macos-x86_64.zip
            build/macos/accelon26-macos-x86_64.zip.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
