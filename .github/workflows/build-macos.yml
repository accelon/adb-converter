name: build-macos

# 用 GitHub Actions 的 macOS runner 編譯 accelon26（Wails v3 + WKWebView）。
#
# 觸發方式：Actions 頁面手動 Run workflow，或推 `mac-*` 標籤。
#
# 產出：artifact `accelon26-macos-arm64`（.app 的 zip ＋ sha256），解開雙擊即可
# （未經 Apple 公證，第一次要在 Finder 右鍵 →「打開」）。
#
# macOS 版的差異（第一版）：
#   * 沒有自動更新（Windows 換的是一顆 exe，macOS 換的是整個 .app，牽涉簽章／公證）。
#     Go 層 updatesSupported() 回 false，About 會顯示「請到官網下載新版」。
#   * 沒有游標座標 API（不用 cgo）：啟動時放在「視窗所在的那張螢幕」，不是游標那張。
#   * mmap／開外部連結／訊息框走 sys_darwin.go（syscall.Mmap、open、osascript）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'mac-*'

jobs:
  build:
    # macos-14 = Apple Silicon（arm64）。要 Intel 版再加一個 job（見 MACOS.md）。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: wails/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # assets/index.html 是單檔 HTML，由 TypeScript 建置腳本產生（不是 npm）。
      # ts/ 沒有任何 npm 依賴（沒有 bun.lock、也沒有 node_modules），所以不必 install。
      - name: 建置單檔 HTML
        working-directory: ts
        run: bun run tools/build-desktop.ts

      # 先跑一次測試：這裡同時驗證了 mmap（syscall.Mmap）、檔案白名單、搜尋解析
      # 這些在 macOS 上真的會執行的程式碼（Windows runner 驗不到這些）。
      - name: 測試（go vet ＋ go test）
        working-directory: wails
        env:
          CGO_ENABLED: '1'
        run: |
          go vet ./...
          go test ./...

      - name: 編譯（macOS arm64）
        working-directory: wails
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p ../build/macos
          # -tags production：Wails 的發佈模式（關掉 devtools 選單與除錯日誌）。
          go build -trimpath -tags production \
            -ldflags "-X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ../build/macos/accelon26 .

      - name: 煙霧測試（-version／-selftest 不開 GUI）
        # 在倉庫根目錄跑：那裡有 13j.adb／yinshun.adb／fgdict.adb，-selftest 會真的
        # mmap 這幾個檔並讀 200 次，等於在 macOS 上驗一遍 syscall.Mmap 那條路。
        run: |
          ./build/macos/accelon26 -version
          ./build/macos/accelon26 -selftest

      - name: 包成 .app
        run: |
          set -euo pipefail
          APP="build/macos/accelon26.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/macos/accelon26 "$APP/Contents/MacOS/accelon26"
          chmod +x "$APP/Contents/MacOS/accelon26"

          # 圖示：www/img/appicon.png（512×512）→ icns
          if [ -f www/img/appicon.png ]; then
            ICONSET="build/macos/accelon26.iconset"
            rm -rf "$ICONSET"; mkdir -p "$ICONSET"
            for s in 16 32 64 128 256 512; do
              sips -z $s $s www/img/appicon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
              d=$((s * 2))
              sips -z $d $d www/img/appicon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/accelon26.icns"
          fi

          # Info.plist 用 PlistBuddy 一行一行寫（不要在 YAML 的 block scalar 裡塞 XML：
          # YAML 的縮排會變成 XML 的前導空白，XML 宣告必須是檔案的第一個字元）。
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string accelon26" \
            -c "Add :CFBundleDisplayName string accelon26" \
            -c "Add :CFBundleIdentifier string cn.shutonggui.accelon26" \
            -c "Add :CFBundleExecutable string accelon26" \
            -c "Add :CFBundleIconFile string accelon26" \
            -c "Add :CFBundlePackageType string APPL" \
            -c "Add :CFBundleShortVersionString string 1.0" \
            -c "Add :CFBundleVersion string 1.0" \
            -c "Add :LSMinimumSystemVersion string 11.0" \
            -c "Add :NSHighResolutionCapable bool true" \
            -c "Add :NSPrincipalClass string NSApplication" \
            "$P"
          plutil -lint "$P"

      - name: 臨時簽章（ad-hoc）
        # 沒有 Apple 開發者憑證也能簽：簽完 Gatekeeper 比較不會說「已損毀」。
        # 使用者第一次開仍要在 Finder 右鍵 →「打開」。
        run: |
          codesign --force --deep --sign - build/macos/accelon26.app
          codesign --verify --verbose build/macos/accelon26.app

      - name: 壓縮（保留 .app 結構與簽章屬性）
        run: |
          cd build/macos
          ditto -c -k --sequesterRsrc --keepParent accelon26.app accelon26-macos-arm64.zip
          shasum -a 256 accelon26-macos-arm64.zip | tee accelon26-macos-arm64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: accelon26-macos-arm64
          path: |
            build/macos/accelon26-macos-arm64.zip
            build/macos/accelon26-macos-arm64.zip.sha256
          if-no-files-found: error
