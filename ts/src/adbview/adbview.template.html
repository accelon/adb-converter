<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>adb viewer</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel2: #2d2d30; --line: #3c3c3c;
    --fg: #d8d8d8; --dim: #909090; --accent: #5aa9ff; --warn: #e0a54a; --err: #e06c75;
    --fs: 15px;               /* base font size */
    --left: 25fr;             /* column widths, draggable; 0fr = hidden */
    --center: 50fr;
    --right: 25fr;
    --minSide: 15;            /* percent: below this a side snaps shut */
  }
  * { box-sizing: border-box; }
  /* The page itself never scrolls: header + main fill the viewport exactly, and
     only the panes that need it (document text, search results, token list)
     scroll. `overflow: hidden` on both html and body kills the page scrollbar. */
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: var(--fs)/1.6 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  }
  body.dragging::after {
    content: "放開以開啟 .adb"; position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; font-size: 26px;
    background: rgba(90,169,255,.12); border: 3px dashed var(--accent);
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 20px; margin: 0; font-weight: 700; letter-spacing: .01em;
    color: #7cc0ff; text-shadow: 0 0 14px rgba(90,169,255,.35);
  }
  header h1 .accent { color: #ffd479; text-shadow: 0 0 14px rgba(255,212,121,.35); }
  /* the database name lives on the chip (#dbTabs); this rule went with #dbname */
  #file { display: none; }   /* the picker is driven by #dbAdd */
.dbAdd { border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink);
  cursor: pointer; font-size: 13px; padding: 1px 7px; line-height: 1.5; }
  .status { font-size: 13px; color: var(--dim); margin-left: auto; }
  .status.err { color: var(--err); }
  .status.busy { color: var(--warn); }
  .sideToggle {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; cursor: pointer; font: inherit; font-size: 15px; padding: 2px 9px; line-height: 1.4;
  }
  .sideToggle:hover { border-color: var(--accent); }
  .sideToggle.off { opacity: .45; }
  #advToggle.on { border-color: var(--accent); background: #2b3b4d; box-shadow: 0 0 8px rgba(90,169,255,.35); }
  /* the side toggles show their state by being dimmed when collapsed */
  #toggleLeft.off, #toggleRight.off { opacity: .45; }
  /* advanced-only tabs: token browser (left) and the file/meta panes (right) */
  .advOnly { display: none; }
  .tabBtn[hidden] { display: none !important; }
  body.advanced .advOnly { display: inline-block; }

  main {
    display: grid;
    /* draggable: default left / middle / right; a hidden side becomes 0fr.
       Height comes from the body grid row (1fr), so no 100vh arithmetic. */
    grid-template-columns: var(--left) 6px var(--center) 6px var(--right);
    gap: 0; background: var(--line);
    min-height: 0; overflow: hidden;
  }
  .col { background: var(--bg); display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; }
  /* the visible grip between columns */
  .splitter { background: var(--line); cursor: col-resize; position: relative; }
  .splitter:hover, .splitter.dragging { background: var(--accent); }
  .splitter::after {
    content: ''; position: absolute; inset: 45% 1px; background: var(--dim); border-radius: 1px;
  }
  .splitter:hover::after { background: #fff; }
  body.colDragging { cursor: col-resize; user-select: none; }
  /* narrow screens: collapse both sides regardless of stored width */
  @media (max-width: 900px) {
    main { grid-template-columns: 0 0 1fr 0 0; }
    .splitter { display: none; }
  }

  /* panes: the column owns the height, the pane content scrolls where needed */
  .pane { border-bottom: 1px solid var(--line); padding: 10px 12px; overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
  /* a flex display would otherwise defeat the hidden attribute */
  .pane[hidden] { display: none; }
  .pane.scroll { overflow: auto; display: block; }
  .pane h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; flex: 0 0 auto; }
  .pane.grow { flex: 1 1 auto; min-height: 0; }
  .pane.fixed { flex: 0 0 auto; }
  .dim { color: var(--dim); }
  .note { color: var(--dim); font-size: 13px; margin: 8px 0 0; }

  /* tabs (left column) */
  .tabs { display: flex; gap: 4px; padding: 8px 10px 0; background: var(--bg); }
  .tabBtn {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 0; margin-right: 6px; cursor: pointer; font: inherit; font-size: 14px;
  }
  .tabBtn.active { background: var(--bg); color: var(--fg); border-color: var(--accent); font-weight: 600; }
  .tabPane { display: none; }
  .tabPane.active { display: block; }
  /* a tab pane that hosts its own scroller fills the pane and lets it scroll */
  .tabs-host { overflow: hidden; }
  .tabs-host .tabPane.active { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .scrollArea { overflow: auto; min-height: 0; flex: 1 1 auto; }
  #searchList { overflow: auto; min-height: 0; flex: 1 1 auto; }
  #tokenRows { overflow: auto; min-height: 0; flex: 1 1 auto; }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 2px 10px 2px 0; white-space: nowrap; vertical-align: top; }
  td { word-break: break-word; }
  table.cap td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  ul { margin: 0; padding-left: 18px; font-size: 14px; }

  .docItem, .clsChip, .vaChip, .hitBar button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; cursor: pointer; font: inherit;
  }
  .docItem { display: block; width: 100%; text-align: left; padding: 6px 10px; margin-bottom: 4px; font-size: 15px; }
  .docItem:hover, .clsChip:hover, .vaChip:hover, .hitBar button:hover { background: var(--panel2); border-color: var(--accent); }
  .docItem.active { border-color: var(--accent); background: #2b3b4d; }
  .docName { display: block; font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 1px 0; }
  .kv span { color: var(--dim); }
  #tokenClasses { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .clsChip { width: auto; margin: 0; font-size: 13px; padding: 3px 9px; }
  .clsChip.dim { opacity: .6; }
  #tokenRows { overflow: auto; flex: 1 1 auto; }
  .tokenRow {
    display: flex; align-items: baseline; gap: 10px; padding: 3px 6px;
    border-bottom: 1px solid #2a2a2a; cursor: pointer; font-size: 17px;
  }
  .tokenRow:hover { background: var(--panel2); }
  .tokName { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tokSize { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dirty { color: var(--warn); font-weight: 700; }
  .vaList { display: flex; flex-wrap: wrap; gap: 4px; max-height: 170px; overflow: auto; }
  .vaChip { width: auto; margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; padding: 2px 8px; }
  .postingHead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .tokBig { font-size: 22px; font-weight: 700; }
  .docHead { font-weight: 600; margin-bottom: 8px; font-size: 15px; }

  /* document text (hard line breaks, one row per line) */
  .docBar { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .docTools { display: flex; align-items: center; gap: 4px; margin-left: auto; font-size: 12px; color: var(--dim); }
  .mini {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer; font: inherit; font-size: 12px; padding: 1px 7px;
  }
  .mini:hover { border-color: var(--accent); }
  .docBody { overflow: auto; min-height: 0; flex: 1 1 auto; font-size: var(--fsdoc, 16px); }
  /* the middle pane only ever scrolls its document body */
  #docText { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }

  /* document tabs: one per linked node. Ctrl/cmd + a linking click opens a new
     one instead of replacing the current one. */
  .docTabs { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; flex: 0 0 auto; }
  .docTabs[hidden] { display: none; }
  .docTabStrip { display: flex; align-items: stretch; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .docTab {
    display: flex; align-items: center; gap: 6px; max-width: 240px;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 3px 6px 3px 10px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .docTab:hover { color: var(--fg); }
  .docTab.active { background: var(--bg); color: var(--fg); border-color: var(--accent); font-weight: 600; }
  .docTabName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docTabClose { color: var(--dim); font-size: 11px; padding: 0 2px; border-radius: 3px; }
  .docTabClose:hover { color: var(--err); background: var(--panel2); }
  /* the page (網頁分頁), NOT the book's folio */
  .docPager {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--dim);
  }
  .docPager .mini[aria-disabled="true"] { opacity: .4; cursor: default; }
  .docPager .mini[aria-disabled="true"]:hover { border-color: var(--line); }
  .pagerInfo { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docLine { display: flex; gap: 10px; padding: 1px 3px; border-radius: 3px; }
  .docLine:hover { background: #262626; }
  .docLine.hitLine { background: #33302a; }
  .lineText { white-space: pre; }   /* hard-wrapped lines: never soft wrap by default */
  mark.docHit { background: #7a4a00; color: #ffd479; border-radius: 2px; padding: 0 2px; }

  .thumbGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .thumb { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px; text-align: center; }
  .thumb img { max-width: 100%; max-height: 62px; display: block; margin: 0 auto 2px; }
  .thumb span { font-size: 10px; color: var(--dim); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=file] { color: var(--fg); font: inherit; font-size: 13px; }

  /* full text search */
  .searchBar { display: flex; gap: 6px; margin-bottom: 8px; }
  .searchBar input {
    flex: 1 1 auto; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 10px; font: inherit; font-size: 16px; min-width: 0;
  }
  .searchBar input:focus { outline: none; border-color: var(--accent); }
  .searchBar button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; cursor: pointer; font: inherit; padding: 0 10px;
  }
  .searchBar button:hover { border-color: var(--accent); }
  .searchBar select.modeSel {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; cursor: pointer; font: inherit; font-size: 13px; padding: 0 4px;
  }
  .snippet {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid transparent;
    border-radius: 5px; padding: 6px 9px; margin-bottom: 6px; cursor: pointer; font-size: 15px;
  }
  .snippet:hover { background: var(--panel2); }
  .snippet.active { border-left-color: var(--accent); background: #2b3b4d; }
  .snippetHead { font-size: 11.5px; color: var(--dim); margin-bottom: 2px; }
  .snippet mark { background: #7a4a00; color: #ffd479; border-radius: 2px; padding: 0 2px; }
  /* search groups (tree tier 1: 書/集…) */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; max-height: 8.6em; overflow: auto; }
  .chips:empty { display: none; }
  .chip {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
    cursor: pointer; font: inherit; font-size: 12px; padding: 1px 7px; white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { border-color: var(--accent); background: #2b3b4d; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.zero { opacity: .45; }

  /* directory tree: fixed row height, depth shown by a 30%-lightness colour dot */
  .tRow {
    display: flex; align-items: center; gap: 4px; padding: 1px 4px; border-radius: 3px;
    cursor: pointer; font-size: 13px; line-height: 1.5; white-space: nowrap;
  }
  .tRow:hover { background: #262626; }
  .tTwisty { width: 12px; text-align: center; color: var(--dim); flex: 0 0 auto; font-size: 11px; }
  .tDot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .tTag { color: var(--dim); font-size: 11px; flex: 0 0 auto; }
  /* the tag name (書/章/節…) is not shown in the directory: the colour block
     already carries the depth, and the name would only repeat it */
  #dirTree .tTag { display: none; }
  .tName { overflow: hidden; text-overflow: ellipsis; }
  .tCount { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* Hit badges are graded by how much of the result sits in that realm: the
     bigger the share, the louder the colour (亮紅 for the heaviest nodes). */
  .tCount.hit { color: #ff8a80; font-weight: 600; }
  .tCount.hit.t2 { color: #ff6b6b; }
  .tCount.hit.t3 { color: #ff3b30; }
  .tCount.hit.t4 { color: #ff1744; font-weight: 700; font-size: 12.5px; text-shadow: 0 0 6px rgba(255,23,68,.5); }
  .tCount.hit.big { font-size: 13px; }
  /* the node whose text the middle pane currently shows, and the node the middle
     of the document pane sits on (with its ancestors lit) */
  .tRow.active { background: #2b3b4d; }
  .tRow.ancestor { background: rgba(90,169,255,.10); }
  .tRow.current { background: #2b3b4d; outline: 1px solid var(--accent); border-radius: 3px; }
  #dirTree { padding: 0; }
.dbTabs { display: inline-flex; gap: 4px; align-items: center; }
/* every chip keeps the same metrics in every state: only the colours change, and the
   ✕ is always laid out (visibility), so activating a chip moves nothing */
.dbTabs .dbChip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 6px; font: inherit; font-size: 13px; font-weight: 600;
  line-height: 1.5; cursor: pointer; color: var(--ink); }
.dbTabs .dbChip:hover { border-color: var(--accent); background: rgba(90,169,255,.08); }
.dbTabs .dbChip.active { border-color: var(--accent); background: rgba(90,169,255,.14); color: #fff; }
.dbTabs .dbChipClose { opacity: 0; margin-left: 2px; }
.dbTabs .dbChip.active .dbChipClose { opacity: .6; }
.dbTabs .dbChipClose:hover { opacity: 1; color: #ff6b6b; }
</style>
</head>
<body>
<header id="header">
  <h1>accelon<span class="accent">26</span></h1>
  <button class="sideToggle" id="toggleLeft" title="顯示／隱藏左欄">◧</button>
  <button class="sideToggle" id="toggleRight" title="顯示／隱藏右欄">◨</button>
  <button class="sideToggle" id="advToggle" title="進階模式：顯示 token 瀏覽與檔案資訊分頁">🧑‍💻</button>
  <input type="file" id="file" accept=".adb" multiple>
  <button class="dbAdd" id="dbAdd" title="開啟 .adb（最多同時 5 個）">＋</button>
  <span class="dbTabs" id="dbTabs"></span>
  <span class="status" id="status"></span>
</header>

<main id="main">
  <!-- 左：每個 <樹 s="…"> 一頁（目錄／名詞／全文．頻次／原書分頁／西文） -->
  <section class="col" id="colLeft">
    <div class="tabs" id="tabsLeft">
      <button class="tabBtn active" data-tab="dir">目錄</button>
      <button class="tabBtn" data-tab="terms" hidden>名詞</button>
      <button class="tabBtn" data-tab="freq" hidden>頻次</button>
      <button class="tabBtn" data-tab="folio" hidden>原書分頁</button>
      <button class="tabBtn" data-tab="latin" hidden>西文</button>
      <button class="tabBtn advOnly" data-tab="token">token</button>
    </div>
    <div class="pane grow tabs-host" id="paneLeft">
      <div class="tabPane active" data-tab="dir">
        <div class="searchBar">
          <input type="search" id="query" placeholder="輸入詞（例：象曰、Buddha）" autocomplete="off" spellcheck="false">
          <button id="queryClear" title="清除">✕</button>
        </div>
        <div id="dirMeta" class="note"></div>
        <div id="dirTree" class="scrollArea"><p class="dim">尚未開啟資料庫。</p></div>
      </div>
      <!-- 名詞：s="$詞"（tag 包裹）。詞條＝<詞> 的實例，字典式查詢。 -->
      <div class="tabPane" data-tab="terms">
        <div class="searchBar">
          <input type="search" id="termsQuery" placeholder="輸入詞條（比對 <詞> 包住的字）" autocomplete="off" spellcheck="false">
          <select id="termsMode" class="modeSel" title="比對位置：開頭＝^、結尾＝$、中間＝兩者都不是">
            <option value="any">任意</option>
            <option value="start">開頭</option>
            <option value="mid">中間</option>
            <option value="end">結尾</option>
          </select>
          <button id="termsClear" title="清除">✕</button>
        </div>
        <div id="termsMeta" class="note"></div>
        <div id="termsList" class="scrollArea"></div>
      </div>
      <div class="tabPane" data-tab="freq">
        <div class="searchBar">
          <input type="search" id="freqQuery" placeholder="輸入詞（分段命中統計）" autocomplete="off" spellcheck="false">
          <button id="freqClear" title="清除">✕</button>
        </div>
        <div id="freqMeta" class="note"></div>
        <div id="freqList" class="scrollArea"></div>
      </div>
      <!-- 原書分頁：s="頁.n"（tag.attr）。列出 <頁> 的 n 值，可直接選或輸入頁碼跳到原書 folio。 -->
      <div class="tabPane" data-tab="folio">
        <div class="searchBar">
          <input type="search" id="folioQuery" placeholder="輸入原書頁碼（例：1、25）或標籤" autocomplete="off" spellcheck="false">
          <button id="folioClear" title="清除">✕</button>
        </div>
        <div id="folioMeta" class="note"></div>
        <div id="folioList" class="scrollArea"></div>
      </div>
      <div class="tabPane" data-tab="latin">
        <div class="searchBar">
          <input type="search" id="latinQuery" placeholder="輸入詞（限西文）" autocomplete="off" spellcheck="false">
          <select id="latinMode" class="modeSel" title="比對位置：開頭＝^、結尾＝$、中間＝兩者都不是">
            <option value="any">任意</option>
            <option value="start">開頭</option>
            <option value="mid">中間</option>
            <option value="end">結尾</option>
          </select>
          <button id="latinClear" title="清除">✕</button>
        </div>
        <div id="latinMeta" class="note"></div>
        <div id="latinList" class="scrollArea"></div>
      </div>
      <div class="tabPane" data-tab="token">
        <div id="tokenSummary"></div>
        <div id="tokenClasses"></div>
        <div class="dim" id="tokenTitle">尚未載入</div>
        <div class="note" id="tokenMore"></div>
        <div id="tokenRows"></div>
      </div>
    </div>
  </section>
  <div class="splitter" id="splitLeft" title="拖曳調整左欄寬度（拖到 15% 以下即隱藏）"></div>

  <!-- 中：文件文字（硬分行；命中直接塗紅） ------------------------------------>
  <section class="col" id="colMid">
    <div class="pane grow">
      <div class="docBar" id="docBar">
        <button class="mini" id="treeReveal" title="展開樹：展開目錄樹並捲到目前捲動位置對應的節點">🌲</button>
        <h2 id="docTitle" style="margin:0">文件內容（硬分行；未渲染 XML）</h2>
        <span class="docTools">
          字級
          <button class="mini" id="fsDown" title="縮小">−</button>
          <span id="fsValue" class="dim">16</span>
          <button class="mini" id="fsUp" title="放大">＋</button>
          <button class="mini" id="fsAuto" title="自動選一個大部份行都不軟換行的字級">不換行</button>
          <button class="mini" id="fsReset" title="回到預設">預設</button>
        </span>
      </div>
      <div class="docTabs" id="docTabs" hidden>
        <div class="docTabStrip" id="docTabStrip"></div>
        <button class="mini" id="docTabAdd" title="新分頁（Ctrl+點任何聯動處也可以）">＋</button>
      </div>
      <div id="docText"><p class="dim">點左側 token，會自動跳到該 token 在文中的位置並只塗紅它。</p></div>
      <div class="docPager" id="docPager" hidden>
        <button class="mini" id="pagePrev" title="上一頁（網頁分頁，不是原書的葉）">◀ 上一頁</button>
        <span class="pagerInfo" id="pageInfo"></span>
        <button class="mini" id="pageNext" title="下一頁（網頁分頁，不是原書的葉）">下一頁 ▶</button>
      </div>
    </div>
  </section>
  <div class="splitter" id="splitRight" title="拖曳調整右欄寬度（拖到 15% 以下即隱藏）"></div>
