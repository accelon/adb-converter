version: '3'

# 極簡 Taskfile：只針對 wails/ 這個 Go module。
# 注意：真正的 adbview 網頁不在這裡建置 —— assets/index.html 由倉庫根目錄的
# TypeScript 建置腳本產生（例如 bun run tools/build-desktop.ts）。
# 這裡不依賴 npm/node。

tasks:
  build:html:
    summary: 說明 assets/index.html 的來源（不在此處建置）
    cmds:
      - echo "assets/index.html 由倉庫根目錄的 TypeScript 建置腳本產生；本任務不呼叫 node/npm。"

  build:
    summary: 建置桌面宿主到 ../build/desktop/adbview.exe
    cmds:
      - go build -o ../build/desktop/adbview.exe .

  test:
    summary: 執行 Go 單元測試
    cmds:
      - go test ./...

  selftest:
    summary: 建置後在倉庫根目錄做無 GUI 自檢
    cmds:
      - task: build
      - cmd: ../build/desktop/adbview.exe -selftest
        dir: ..

  run:
    summary: 建置後從倉庫根目錄啟動 GUI
    cmds:
      - task: build
      - cmd: ../build/desktop/adbview.exe
        dir: ..
