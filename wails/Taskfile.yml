version: '3'

# 極簡 Taskfile：只針對 wails/ 這個 Go module。
# 注意：真正的 accelon26 網頁不在這裡建置 —— assets/index.html 由倉庫根目錄的
# TypeScript 建置腳本產生（例如 bun run tools/build-desktop.ts）。
# 這裡不依賴 npm/node。

tasks:
  build:html:
    summary: 說明 assets/index.html 的來源（不在此處建置）
    cmds:
      - echo "assets/index.html 由倉庫根目錄的 TypeScript 建置腳本產生；本任務不呼叫 node/npm。"

  build:
    summary: 建置桌面宿主到 accelon3\accelon26.exe（GUI 子系統；那裡就是 accelon3 的資料夾，.adb 都在）
    cmds:
      - go build -ldflags "-H windowsgui" -o ..\accelon3\accelon26.exe .

  test:
    summary: 執行 Go 單元測試
    cmds:
      - go test ./...

  selftest:
    summary: 建置後在 accelon3\ 做無 GUI 自檢（順便列出那裡的 .adb）
    cmds:
      - task: build
      - cmd: accelon26.exe -selftest
        dir: ../accelon3

  run:
    summary: 建置後從 accelon3\ 啟動 GUI（那裡有 .adb）
    cmds:
      - task: build
      - cmd: accelon26.exe
        dir: ../accelon3
