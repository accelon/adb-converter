# accelon26 官網「留言給作者」的 CGI 設定（作者 2026-10-18）。
#
# 只有這一個檔案會被 Apache 讀到；不安裝時 /accelon26/message.cgi 只是一般的 404，
# 網頁會自動退回「用你的郵件程式寄出」，所以這個設定是可有可無的增強。
#
# 安裝／還原：
#   sudo a2enconf accelon26-message && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo a2disconf accelon26-message && sudo systemctl reload apache2
<Directory /var/www/html/accelon26>
    Options +ExecCGI
    AddHandler cgi-script .cgi
    # 留言的 JSON 上限（腳本自己也擋 32 KB）
    LimitRequestBody 65536
</Directory>
